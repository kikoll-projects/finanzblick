name: Monatsrückblick-Short aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden (UTC)
  workflow_dispatch:          # zusätzlich per Knopf "Run workflow" startbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feed lesen und shorts.json aktualisieren
        run: python3 scripts/update_shorts.py
      - name: Änderung speichern
        run: |
          if git diff --quiet -- data/shorts.json; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shorts.json
          git commit -m "Short aktualisiert"
          git push
